version: 2

updates:
  # ----------------------------------------------------------------------
  # npm
  #
  # Grouped on purpose. Ungrouped, every transitive bump arrives as its own
  # pull request, which is how a bump for a package that had already left
  # the project sat open for weeks. One pull request per group is reviewed
  # and merged in a single pass; a major still arrives alone, because those
  # are the ones that need reading.
  # ----------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Everything the site ships to the browser
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      # Build, test and lint tooling
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      # Security fixes travel together and get merged first
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  # ----------------------------------------------------------------------
  # GitHub Actions
  #
  # deploy.yml pins actions/checkout, actions/setup-node and
  # peaceiris/actions-gh-pages. Nothing watched these before, so a pinned
  # major could go stale without anything saying so.
  # ----------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
