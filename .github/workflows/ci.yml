name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same branch or pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0 # git hooks are for local commits only

jobs:
  checks:
    name: Format, lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run type-check
      - run: npm run test:ci

  build:
    name: Build, size budgets and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size

      # Contrast and focus visibility need a real browser; jsdom cannot see them
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
